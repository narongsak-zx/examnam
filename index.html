<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทดสอบจำลองออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .hidden-section { display: none; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="text-gray-800" onload="init()">

    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold cursor-pointer flex items-center" onclick="show('home-subjects')">
                <i class="fas fa-graduation-cap mr-2 text-indigo-300"></i> SmartExam Mockup
            </h1>
            <button onclick="show('history')" class="hover:bg-indigo-800 px-3 py-2 rounded text-sm transition flex items-center">
                <i class="fas fa-history mr-1"></i> ประวัติการสอบ
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 mt-4">
        
        <!-- Section: Select Subject -->
        <div id="home-subjects" class="bg-white rounded-xl shadow-md p-6">
            <div class="border-b pb-4 mb-6">
                <h2 class="text-2xl font-bold text-indigo-900">เลือกรายวิชาที่ต้องการทดสอบ</h2>
                <p class="text-gray-600 mt-1">คลิกเลือกวิชาเพื่อดูชุดข้อสอบที่มีอยู่ในระบบ (รวม 300 ข้อ)</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5" id="subject-list">
                <!-- รายชื่อวิชาจะถูกสร้างที่นี่ -->
            </div>
        </div>

        <!-- Section: Select Exam Set -->
        <div id="home-sets" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="border-b pb-4 mb-6 flex justify-between items-start">
                <div>
                    <button onclick="show('home-subjects')" class="text-indigo-600 hover:text-indigo-800 text-sm mb-2 inline-block font-semibold">
                        <i class="fas fa-arrow-left mr-1"></i> กลับไปเลือกวิชา
                    </button>
                    <h2 class="text-2xl font-bold text-indigo-900" id="subject-title-display">ชื่อวิชา</h2>
                    <p class="text-gray-600 mt-1">เลือกชุดข้อสอบที่คุณต้องการทดสอบ</p>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="exam-list">
                <!-- ชุดข้อสอบจะถูกสร้างที่นี่ -->
            </div>
        </div>

        <!-- Section: Exam Form -->
        <div id="exam-area" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <div>
                    <h2 id="exam-title" class="text-2xl font-bold text-indigo-800"></h2>
                    <p class="text-sm text-gray-500 mt-1">เลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว</p>
                </div>
                <button onclick="if(confirm('ต้องการยกเลิกการทำข้อสอบชุดนี้หรือไม่?')) show('home-sets')" class="text-gray-400 hover:text-red-500 text-sm">
                    <i class="fas fa-times-circle text-lg"></i> ยกเลิก
                </button>
            </div>
            <form id="exam-form" onsubmit="submitExam(event)">
                <div id="mcq-questions" class="space-y-6"></div>
                <div class="text-center mt-10 pb-6 border-t pt-6">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-10 rounded-xl shadow-lg transition transform hover:scale-105">
                        <i class="fas fa-check-circle mr-2"></i> ส่งตรวจข้อสอบ
                    </button>
                </div>
            </form>
        </div>

        <!-- Section: Result / History Detail -->
        <div id="result-area" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="text-center border-b pb-6 mb-6">
                <h2 class="text-3xl font-extrabold text-indigo-900 mb-1">ผลการประเมิน</h2>
                <p class="text-sm text-gray-500 mb-2" id="result-meta-info"></p>
                <div class="text-5xl font-black text-indigo-600 my-4" id="final-score"></div>
                <p class="text-lg font-semibold text-gray-700" id="percentage-score"></p>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-list-ol mr-2 text-indigo-600"></i> เฉลยและคำอธิบายรายข้อ</h3>
            <div id="result-details" class="space-y-4"></div>
            <div class="text-center mt-8 pt-4 border-t flex justify-center space-x-4">
                <button onclick="show('history')" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2 px-6 rounded-lg transition border border-gray-300">กลับประวัติการสอบ</button>
                <button onclick="show('home-subjects')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition">กลับหน้าแรกสุด</button>
            </div>
        </div>

        <!-- Section: History List -->
        <div id="history" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-3">
                <h2 class="text-2xl font-bold text-indigo-900">ประวัติการทำข้อสอบ</h2>
                <button onclick="clearHistory()" class="text-red-600 border border-red-200 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-50 transition">
                    <i class="fas fa-trash-alt mr-1"></i> ล้างประวัติ
                </button>
            </div>
            <div id="history-list" class="space-y-3"></div>
        </div>

    </main>

    <script>

        let currentSubjectKey = null;
        let currentExamId = null;
        const optionsLabels = ['ก', 'ข', 'ค', 'ง'];

        function show(id) {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden-section'));
            document.getElementById(id).classList.remove('hidden-section');
            window.scrollTo(0, 0);
        }

        function init() {
            const list = document.getElementById('subject-list');
            for (let key in subjectsData) {
                const sub = subjectsData[key];
                list.innerHTML += `
                    <div onclick="selectSubject('${key}')" class="border border-${sub.color}-100 rounded-xl p-5 hover:shadow-lg bg-${sub.color}-50/30 flex flex-col justify-center items-center text-center transition cursor-pointer hover:border-${sub.color}-300 group">
                        <div class="w-16 h-16 rounded-full bg-${sub.color}-100 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300">
                            <i class="${sub.icon} text-3xl text-${sub.color}-600"></i>
                        </div>
                        <h3 class="font-bold text-lg text-${sub.color}-900">${sub.code}</h3>
                        <p class="text-sm text-gray-600 mt-1">${sub.title}</p>
                    </div>`;
            }
            renderHistory();
        }

        function selectSubject(subjectKey) {
            currentSubjectKey = subjectKey;
            const sub = subjectsData[subjectKey];
            document.getElementById('subject-title-display').innerText = `${sub.code} : ${sub.title}`;
            
            const list = document.getElementById('exam-list');
            list.innerHTML = '';
            
            for (let setId in sub.sets) {
                const ex = sub.sets[setId];
                const count = ex.data.length;
                list.innerHTML += `
                    <div class="border border-${sub.color}-100 rounded-xl p-5 hover:shadow-lg bg-${sub.color}-50/10 flex flex-col justify-between transition">
                        <div>
                            <span class="inline-block bg-${sub.color}-100 text-${sub.color}-800 text-xs px-2.5 py-1 rounded-full font-bold mb-3 border border-${sub.color}-200">ปรนัย ${count} ข้อ</span>
                            <h3 class="font-bold text-lg mb-2 text-${sub.color}-900">${ex.title}</h3>
                        </div>
                        <button onclick="startExam('${setId}')" ${count === 0 ? 'disabled' : ''} class="w-full ${count === 0 ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : `bg-${sub.color}-600 hover:bg-${sub.color}-700 text-white`} py-2.5 rounded-lg font-semibold transition shadow-sm mt-4">
                            ${count === 0 ? 'ยังไม่เปิดให้สอบ' : 'เริ่มทำข้อสอบ'}
                        </button>
                    </div>`;
            }
            show('home-sets');
        }

        function startExam(setId) {
            currentExamId = setId;
            const sub = subjectsData[currentSubjectKey];
            const examData = sub.sets[setId];
            
            document.getElementById('exam-title').innerText = examData.title;
            const container = document.getElementById('mcq-questions');
            let html = '';
            
            examData.data.forEach((q, i) => {
                html += `
                <div class="border border-gray-200 rounded-xl p-5 bg-gray-50 shadow-sm hover:bg-white transition">
                    <p class="font-bold text-gray-800 text-base mb-4 leading-relaxed">
                        <span class="inline-block bg-${sub.color}-600 text-white rounded-md px-2 py-0.5 text-sm mr-1.5 font-mono shadow-sm">${i + 1}</span> ${q[0]}
                    </p>
                    <div class="space-y-2.5 pl-2">
                        ${q[1].map((opt, j) => `
                        <label class="flex items-center p-3 rounded-lg border border-transparent hover:border-${sub.color}-200 hover:bg-${sub.color}-50/50 cursor-pointer transition">
                            <input type="radio" name="q${i}" value="${j}" required class="w-4 h-4 text-${sub.color}-600 focus:ring-${sub.color}-500 mr-3">
                            <span class="text-sm font-medium text-gray-700 leading-normal"><strong class="font-bold text-${sub.color}-900 mr-2">${optionsLabels[j]}.</strong> ${opt}</span>
                        </label>`).join('')}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            document.getElementById('exam-form').reset();
            show('exam-area');
        }

        function submitExam(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const sub = subjectsData[currentSubjectKey];
            const examData = sub.sets[currentExamId];
            let score = 0;
            let userAnswers = [];

            examData.data.forEach((q, i) => {
                const userAns = parseInt(fd.get(`q${i}`));
                userAnswers.push(userAns);
                if (userAns === q[2]) score++;
            });

            const historyId = Date.now();
            saveHistory(currentSubjectKey, currentExamId, `${sub.code} - ${examData.title}`, score, examData.data.length, userAnswers, historyId);
            viewHistoryDetail(historyId);
        }

        function saveHistory(subjectKey, examKey, title, score, total, userAnswers, historyId) {
            let history = JSON.parse(localStorage.getItem('smartExamHistoryMaster')) || [];
            history.unshift({ id: historyId, subjectKey, examKey, title, score, total, userAnswers, date: new Date().toLocaleString('th-TH') });
            localStorage.setItem('smartExamHistoryMaster', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('smartExamHistoryMaster')) || [];
            if (history.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400">ยังไม่มีประวัติการสอบ</div>`;
                return;
            }
            container.innerHTML = history.map(item => `
                <div onclick="viewHistoryDetail(${item.id})" class="border border-gray-200 rounded-xl p-4 flex justify-between items-center bg-white shadow-sm hover:shadow-md hover:border-indigo-300 transition cursor-pointer">
                    <div>
                        <h4 class="font-bold text-indigo-900">${item.title}</h4>
                        <p class="text-xs text-gray-500 mt-1"><i class="far fa-clock mr-1"></i> ${item.date}</p>
                    </div>
                    <div class="text-right flex items-center">
                        <div class="mr-4">
                            <span class="text-2xl font-black text-indigo-600">${item.score}</span>
                            <span class="text-sm text-gray-400">/ ${item.total}</span>
                        </div>
                        <i class="fas fa-chevron-right text-indigo-300 text-lg"></i>
                    </div>
                </div>`).join('');
        }

        function viewHistoryDetail(historyId) {
            let history = JSON.parse(localStorage.getItem('smartExamHistoryMaster')) || [];
            let item = history.find(h => h.id === historyId);
            if (!item) return;

            const sub = subjectsData[item.subjectKey];
            const examData = sub.sets[item.examKey];
            let resultHtml = '';

            examData.data.forEach((q, i) => {
                const userAns = item.userAnswers[i];
                const isCorrect = userAns === q[2];

                resultHtml += `
                <div class="border rounded-xl p-5 mb-4 shadow-sm ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
                    <div class="flex items-start justify-between">
                        <p class="font-bold text-gray-900 mb-3 leading-relaxed">ข้อที่ ${i + 1}: ${q[0]}</p>
                        <span class="text-xs px-2.5 py-1 rounded font-bold shadow-sm ${isCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}">
                            ${isCorrect ? 'ถูกต้อง' : 'ไม่ถูกต้อง'}
                        </span>
                    </div>
                    <div class="text-sm space-y-2 mb-4">
                        <p class="text-gray-700">คำตอบของคุณ: <span class="font-semibold ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">${optionsLabels[userAns]}. ${q[1][userAns]}</span></p>
                        ${!isCorrect ? `<p class="text-gray-700">คำตอบที่ถูกต้อง: <span class="text-emerald-700 font-bold">${optionsLabels[q[2]]}. ${q[1][q[2]]}</span></p>` : ''}
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-gray-200 text-sm text-gray-600 shadow-sm leading-relaxed">
                        <strong class="text-${sub.color}-900"><i class="fas fa-lightbulb text-yellow-500 mr-1.5"></i>คำอธิบาย:</strong> ${q[3]}
                    </div>
                </div>`;
            });

            document.getElementById('result-meta-info').innerText = `${item.title} | ทำเมื่อ: ${item.date}`;
            document.getElementById('final-score').innerText = `${item.score} / ${item.total}`;
            document.getElementById('final-score').className = `text-5xl font-black text-${sub.color}-600 my-4`;
            const percentage = Math.round((item.score / item.total) * 100);
            document.getElementById('percentage-score').innerText = `คิดเป็น ${percentage}% (${item.score >= item.total/2 ? 'ผ่านเกณฑ์' : 'ควรทบทวน'})`;
            document.getElementById('result-details').innerHTML = resultHtml;
            
            show('result-area');
        }

        function clearHistory() {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างประวัติการสอบทั้งหมด?')) {
                localStorage.removeItem('smartExamHistoryMaster');
                renderHistory();
            }
        }
    </script>
</body>
</html>
