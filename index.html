<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทดสอบจำลองออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .hidden-section { display: none; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="text-gray-800" onload="init()">

    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold cursor-pointer flex items-center" onclick="show('home-subjects')">
                <i class="fas fa-graduation-cap mr-2 text-indigo-300"></i> SmartExam Mockup
            </h1>
            <button onclick="show('history')" class="hover:bg-indigo-800 px-3 py-2 rounded text-sm transition flex items-center">
                <i class="fas fa-history mr-1"></i> ประวัติการสอบ
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 mt-4">
        
        <!-- Section: Select Subject -->
        <div id="home-subjects" class="bg-white rounded-xl shadow-md p-6">
            <div class="border-b pb-4 mb-6">
                <h2 class="text-2xl font-bold text-indigo-900">เลือกรายวิชาที่ต้องการทดสอบ</h2>
                <p class="text-gray-600 mt-1">คลิกเลือกวิชาเพื่อดูชุดข้อสอบที่มีอยู่ในระบบ (รวมทั้งหมด 480 ข้อ)</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5" id="subject-list">
                <!-- รายชื่อวิชาจะถูกสร้างที่นี่ -->
            </div>
        </div>

        <!-- Section: Select Exam Set -->
        <div id="home-sets" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="border-b pb-4 mb-6 flex justify-between items-start">
                <div>
                    <button onclick="show('home-subjects')" class="text-indigo-600 hover:text-indigo-800 text-sm mb-2 inline-block font-semibold">
                        <i class="fas fa-arrow-left mr-1"></i> กลับไปเลือกวิชา
                    </button>
                    <h2 class="text-2xl font-bold text-indigo-900" id="subject-title-display">ชื่อวิชา</h2>
                    <p class="text-gray-600 mt-1">เลือกชุดข้อสอบที่คุณต้องการทดสอบ</p>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="exam-list">
                <!-- ชุดข้อสอบจะถูกสร้างที่นี่ -->
            </div>
        </div>

        <!-- Section: Exam Form -->
        <div id="exam-area" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <div>
                    <h2 id="exam-title" class="text-2xl font-bold text-indigo-800"></h2>
                    <p class="text-sm text-gray-500 mt-1">เลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว</p>
                </div>
                <button onclick="if(confirm('ต้องการยกเลิกการทำข้อสอบชุดนี้หรือไม่?')) show('home-sets')" class="text-gray-400 hover:text-red-500 text-sm">
                    <i class="fas fa-times-circle text-lg"></i> ยกเลิก
                </button>
            </div>
            <form id="exam-form" onsubmit="submitExam(event)">
                <div id="mcq-questions" class="space-y-6"></div>
                <div class="text-center mt-10 pb-6 border-t pt-6">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-10 rounded-xl shadow-lg transition transform hover:scale-105">
                        <i class="fas fa-check-circle mr-2"></i> ส่งตรวจข้อสอบ
                    </button>
                </div>
            </form>
        </div>

        <!-- Section: Result / History Detail -->
        <div id="result-area" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="text-center border-b pb-6 mb-6">
                <h2 class="text-3xl font-extrabold text-indigo-900 mb-1">ผลการประเมิน</h2>
                <p class="text-sm text-gray-500 mb-2" id="result-meta-info"></p>
                <div class="text-5xl font-black text-indigo-600 my-4" id="final-score"></div>
                <p class="text-lg font-semibold text-gray-700" id="percentage-score"></p>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-list-ol mr-2 text-indigo-600"></i> เฉลยและคำอธิบายรายข้อ</h3>
            <div id="result-details" class="space-y-4"></div>
            <div class="text-center mt-8 pt-4 border-t flex justify-center space-x-4">
                <button onclick="show('history')" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2 px-6 rounded-lg transition border border-gray-300">กลับประวัติการสอบ</button>
                <button onclick="show('home-subjects')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition">กลับหน้าแรกสุด</button>
            </div>
        </div>

        <!-- Section: History List -->
        <div id="history" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-3">
                <h2 class="text-2xl font-bold text-indigo-900">ประวัติการทำข้อสอบ</h2>
                <button onclick="clearHistory()" class="text-red-600 border border-red-200 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-50 transition">
                    <i class="fas fa-trash-alt mr-1"></i> ล้างประวัติ
                </button>
            </div>
            <div id="history-list" class="space-y-3"></div>
        </div>

    </main>

    <script>

                        ["มาตรฐาน ว 1 อยู่ในสาระใด", ["วิทยาศาสตร์กายภาพ", "วิทยาศาสตร์ชีวภาพ", "วิทยาศาสตร์โลกและอวกาศ", "เทคโนโลยี"], 1, "ว 1 เป็นกลุ่มมาตรฐานด้านวิทยาศาสตร์ชีวภาพ ส่วน ว 2 = กายภาพ, ว 3 = โลกและอวกาศ และ ว 4 = เทคโนโลยี"],
                        ["ระดับชั้นใดมีจำนวนตัวชี้วัดทั้งหมดมากที่สุดตามตารางข้อมูลทางการที่ใช้ในการจัดการเรียนรู้", ["ป.3", "ป.4", "ป.5", "ป.6"], 2, "ป.5 มี 32 ตัวชี้วัด มากกว่า ป.6 ที่มี 30 ตัวชี้วัด"],
                        ["ข้อใดเป็นจำนวนตัวชี้วัดของ ป.3", ["15", "21", "25", "32"], 2, "จำนวนตัวชี้วัดคือ ป.1 = 15, ป.2 = 16, ป.3 = 25, ป.4 = 21, ป.5 = 32 และ ป.6 = 30"],
                        ["การวิเคราะห์ตัวชี้วัดในด้านพุทธิพิสัยเกี่ยวข้องกับเรื่องใดมากที่สุด", ["ความรู้และการคิด", "การเคลื่อนไหวร่างกาย", "ความรู้สึกและเจตคติ", "การใช้เครื่องมือเท่านั้น"], 0, "Cognitive Domain หรือพุทธิพิสัยเกี่ยวข้องกับความรู้ ความเข้าใจ และกระบวนการคิด"],
                        ["ข้อใดเป็นจุดประสงค์ด้าน K", ["นักเรียนสามารถทดลองได้", "นักเรียนสามารถอธิบายการเกิดเงาได้", "นักเรียนมีความรับผิดชอบในการทำงาน", "นักเรียนสามารถใช้เครื่องมือวัดได้"], 1, "K = Knowledge เน้นความรู้และความเข้าใจ การ “อธิบาย” แนวคิดจึงเป็นตัวอย่างของ K"],
                        ["ข้อใดสอดคล้องกับ P ใน K-P-A มากที่สุด", ["นักเรียนอธิบายวัฏจักรน้ำได้", "นักเรียนมีความสนใจในการทดลอง", "นักเรียนสามารถทดลองและบันทึกข้อมูลได้", "นักเรียนเห็นความสำคัญของวิทยาศาสตร์"], 2, "P เน้นทักษะหรือการปฏิบัติ เช่น ทดลอง ใช้เครื่องมือ และบันทึกข้อมูล"],
                        ["ข้อใดเป็นตัวอย่างของ A ใน K-P-A", ["อธิบายสมบัติของสาร", "วัดอุณหภูมิ", "จำแนกวัตถุ", "มีความรับผิดชอบในการทำงานกลุ่ม"], 3, "A = Affective เกี่ยวข้องกับเจตคติ คุณลักษณะ ความรู้สึก และพฤติกรรมด้านคุณค่า"],
                        ["ข้อใดเป็นระดับสูงสุดของ Revised Bloom’s Taxonomy", ["Analyze", "Evaluate", "Create", "Apply"], 2, "Revised Bloom เรียงเป็น Remember → Understand → Apply → Analyze → Evaluate → Create"],
                        ["นักเรียนเปรียบเทียบข้อมูลจากการทดลองสองกลุ่มแล้วหาความแตกต่าง กิจกรรมนี้เด่นในระดับใด", ["Remember", "Understand", "Analyze", "Create"], 2, "การเปรียบเทียบ แยกองค์ประกอบ และค้นหาความสัมพันธ์เป็นการวิเคราะห์ หรือ Analyze"],
                        ["การจัดวัตถุเป็นกลุ่มตามสี รูปร่าง หรือสมบัติ เป็นทักษะใด", ["การวัด", "การจำแนกประเภท", "การพยากรณ์", "การทดลอง"], 1, "การจัดสิ่งต่าง ๆ เป็นกลุ่มตามเกณฑ์คือ Classifying หรือการจำแนกประเภท"],
                        ["นักเรียนใช้เทอร์มอมิเตอร์วัดอุณหภูมิ เป็นทักษะใด", ["การวัด", "การพยากรณ์", "การลงความเห็น", "การตั้งสมมติฐาน"], 0, "การใช้เครื่องมือเพื่อหาค่าปริมาณ เช่น อุณหภูมิ เป็นทักษะการวัด"],
                        ["นักเรียนกล่าวว่า “ถ้าเพิ่มปริมาณแสง พืชน่าจะเจริญเติบโตเร็วขึ้น” ข้อความนี้เป็นตัวอย่างของ", ["การจำแนก", "การตั้งสมมติฐาน", "การตีความข้อมูล", "การวัด"], 1, "เป็นการคาดคะเนคำตอบที่สามารถตรวจสอบได้ จึงเป็นสมมติฐาน"],
                        ["นักเรียนดูข้อมูลความสูงของต้นไม้แล้วคาดการณ์ว่าอีกหนึ่งสัปดาห์ต้นไม้จะสูงขึ้นอีก ข้อใดตรงที่สุด", ["การพยากรณ์", "การทดลอง", "การวัด", "การจำแนก"], 0, "การคาดการณ์สิ่งที่จะเกิดขึ้นจากข้อมูลที่มีคือ Predicting หรือการพยากรณ์"],
                        ["ข้อใดอธิบาย Active Learning ได้ถูกต้องที่สุด", ["นักเรียนต้องเคลื่อนไหวตลอดเวลา", "นักเรียนต้องทำงานกลุ่มทุกกิจกรรม", "นักเรียนมีส่วนร่วมทางความคิดและการเรียนรู้อย่างแท้จริง", "ครูต้องไม่อธิบายเนื้อหาเลย"], 2, "Active Learning เน้นการมีส่วนร่วมอย่างแท้จริง โดยเฉพาะการคิด ตั้งคำถาม วิเคราะห์ และสร้างความเข้าใจ ไม่ใช่เพียงการเคลื่อนไหว"],
                        ["นักเรียนนั่งอยู่กับที่แต่กำลังอภิปรายข้อมูลและโต้แย้งด้วยหลักฐาน แสดงถึง Active Learning ด้านใดเด่นที่สุด", ["กาย", "สติปัญญาและสังคม", "อารมณ์เท่านั้น", "กายเท่านั้น"], 1, "นักเรียนกำลังคิด วิเคราะห์ และแลกเปลี่ยนความคิดเห็น จึงเกิดทั้ง Intellectual และ Social Active"],
                        ["การให้สมาชิกกลุ่มมีบทบาทและร่วมตัดสินใจ ส่งเสริม Active Learning ด้านใด", ["Socially Active", "Physically Active", "Emotionally Active เท่านั้น", "ไม่มีข้อใด"], 0, "การสื่อสาร ทำงานร่วมกัน และตัดสินใจร่วมกันเป็นลักษณะของการตื่นตัวทางสังคม"],
                        ["ข้อใดเป็นลักษณะสำคัญของ Inquiry", ["ครูบอกคำตอบก่อนการทดลอง", "ผู้เรียนใช้ข้อมูลและหลักฐานสร้างคำอธิบาย", "ผู้เรียนท่องจำขั้นตอน", "ผู้เรียนทำกิจกรรมให้สนุกเท่านั้น"], 1, "Inquiry เน้นคำถาม การสืบค้นข้อมูล/หลักฐาน การสร้างคำอธิบาย และการให้เหตุผล"],
                        ["ครูกำหนดหัวข้อ คำถาม และขั้นตอนทั้งหมด นักเรียนเพียงดำเนินการตาม เป็น Inquiry ระดับใดมากที่สุด", ["Open Inquiry", "Guided Inquiry", "Structured Inquiry", "True Inquiry"], 2, "Structured Inquiry คือครูกำหนดคำถามและแนวทางหรือขั้นตอน ส่วนผู้เรียนดำเนินการ วิเคราะห์ และสรุป"],
                        ["ครูกำหนดเพียงคำถาม แต่นักเรียนออกแบบการทดลองเอง เป็น Inquiry ระดับใด", ["Confirmation", "Structured", "Guided", "Open"], 2, "Guided Inquiry ครูกำหนดคำถามหรือปัญหา แต่นักเรียนมีส่วนในการออกแบบวิธีการศึกษา"],
                        ["ข้อใดเป็นลักษณะของ Open Inquiry", ["ครูกำหนดคำถามและขั้นตอนทั้งหมด", "ครูกำหนดคำถาม แต่นักเรียนทำตามขั้นตอน", "นักเรียนตั้งคำถามและออกแบบการศึกษาเอง", "นักเรียนทำตามแบบจำลองของครู"], 2, "Open Inquiry ให้อิสระแก่ผู้เรียนสูงสุด ตั้งแต่การตั้งคำถามจนถึงการออกแบบและดำเนินการศึกษา"],
                        ["ข้อใดกล่าวถูกต้องเกี่ยวกับ Inquiry และ 5E", ["เป็นสิ่งเดียวกัน", "Inquiry เป็นชื่ออีกชื่อหนึ่งของ 5E", "ไม่ใช่สิ่งเดียวกัน แต่ 5E สามารถใช้จัดการเรียนรู้ที่มีลักษณะสืบเสาะได้", "5E ใช้ได้เฉพาะวิชาวิทยาศาสตร์เท่านั้น"], 2, "Inquiry เป็นแนวทางการเรียนรู้ ส่วน 5E เป็นวัฏจักรการเรียนรู้รูปแบบหนึ่ง"],
                        ["สถานการณ์ Inquiry ที่ดีควรมีลักษณะใด", ["มีคำตอบตายตัวตั้งแต่ต้น", "ทำให้ผู้เรียนสงสัยและนำไปสู่คำถามที่ตรวจสอบได้", "ยากเกินวัย", "ไม่จำเป็นต้องเกี่ยวข้องกับจุดประสงค์"], 1, "สถานการณ์ควรกระตุ้นความสงสัยและสามารถนำไปสู่การตั้งคำถามหรือการสืบเสาะได้"],
                        ["ข้อใดเป็นองค์ประกอบสำคัญของแผนการจัดการเรียนรู้", ["มาตรฐานและตัวชี้วัด", "จุดประสงค์", "กิจกรรมและการประเมิน", "ถูกทุกข้อ"], 3, "ทั้งหมดเป็นองค์ประกอบสำคัญของแผน และต้องเชื่อมโยงกัน"],
                        ["ข้อใดแสดงความสอดคล้องของแผนได้ดีที่สุด", ["ตัวชี้วัด → จุดประสงค์ → กิจกรรม → ประเมิน", "สื่อ → ข้อสอบ → ตัวชี้วัด → จุดประสงค์", "กิจกรรม → ตัวชี้วัด → สื่อ → เวลา", "ข้อสอบ → หนังสือ → จุดประสงค์ → ตัวชี้วัด"], 0, "แผนที่ดีต้องเริ่มจากสิ่งที่หลักสูตรต้องการ แล้วออกแบบจุดประสงค์ กิจกรรม และการประเมินให้สอดคล้องกัน"],
                        ["Formative Assessment หมายถึงอะไร", ["การประเมินปลายภาคเท่านั้น", "การประเมินระหว่างเรียนเพื่อใช้พัฒนาการเรียนรู้", "การสอบแข่งขัน", "การประเมินเฉพาะเจตคติ"], 1, "Formative Assessment คือการประเมินระหว่างกระบวนการเรียนรู้ เพื่อนำข้อมูลไปปรับการสอนและช่วยผู้เรียน"],
                        ["หากครูต้องการให้นักเรียนเห็นปรากฏการณ์ที่ไม่สามารถทดลองจริงได้อย่างปลอดภัย ควรพิจารณาสื่อใด", ["Virtual Lab", "สมุดเปล่า", "แบบท่องจำ", "กระดาษคำตอบอย่างเดียว"], 0, "Virtual Lab สามารถจำลองสถานการณ์ที่เข้าถึงยากหรือมีข้อจำกัดด้านความปลอดภัย"],
                        ["ข้อใดไม่ใช่เกณฑ์สำคัญในการเลือกสื่อ", ["จุดประสงค์", "อายุผู้เรียน", "ความปลอดภัย", "ราคาสูงที่สุด"], 3, "สื่อไม่จำเป็นต้องแพงที่สุด แต่ต้องเหมาะกับจุดประสงค์ ผู้เรียน เนื้อหา และบริบท"],
                        ["หากนักเรียนบอกข้อสรุปจาก “ความรู้สึกส่วนตัว” ครูควรกระตุ้นให้นักเรียนทำสิ่งใด", ["เชื่อตามความรู้สึก", "หาข้อมูลหรือหลักฐานสนับสนุน", "เปลี่ยนคำตอบทันที", "ท่องจำคำตอบของครู"], 1, "การสรุปทางวิทยาศาสตร์ควรมีข้อมูลหรือหลักฐานสนับสนุน"],
                        ["ข้อใดสรุปหัวใจของการจัดการเรียนรู้วิทยาศาสตร์ได้ดีที่สุด", ["ครูพูด นักเรียนจด", "นักเรียนจำคำตอบ", "นักเรียนคิด ตั้งคำถาม ลงมือทำ ใช้หลักฐาน และสื่อสาร", "นักเรียนทำแบบฝึกหัดให้ได้จำนวนมากที่สุด"], 2, "เป็นการรวมองค์ประกอบสำคัญของ Active Learning และ Inquiry เข้าด้วยกัน"]
                    ]},
                    "sci-set-2": { title: "แบบทดสอบ ชุดที่ 2", data: [
                        ["ถ้าครูต้องการพัฒนาความสามารถของผู้เรียนในการใช้ข้อมูลเพื่อสร้างข้อสรุป ควรเน้นสิ่งใด", ["การท่องจำ", "การใช้หลักฐาน", "การคัดลอก", "การฟังบรรยาย"], 1, "การสร้างข้อสรุปทางวิทยาศาสตร์ควรอาศัยข้อมูลและหลักฐาน ไม่ใช่ความคิดเห็นเพียงอย่างเดียว"],
                        ["ข้อใดจับคู่มาตรฐานกับสาระได้ถูกต้อง", ["ว1 – กายภาพ", "ว2 – กายภาพ", "ว3 – เทคโนโลยี", "ว4 – ชีวภาพ"], 1, "ว1 = ชีวภาพ, ว2 = กายภาพ, ว3 = โลกและอวกาศ, ว4 = เทคโนโลยี"],
                        ["หากข้อสอบถาม “ชั้นใดมีตัวชี้วัดมากที่สุด” ควรตอบข้อใด", ["ป.2", "ป.3", "ป.5", "ป.6"], 2, "ป.5 มี 32 ตัวชี้วัด ซึ่งมากที่สุดในระดับ ป.1–ป.6 ตามตารางข้อมูลที่ใช้อ้างอิง"],

                        ["ข้อใดอธิบาย Open Inquiry ได้ถูกต้อง", ["ครูกำหนดคำตอบ", "ครูกำหนดขั้นตอนทั้งหมด", "นักเรียนมีส่วนตั้งคำถามและออกแบบการศึกษาเอง", "นักเรียนทำใบงานตามตัวอย่าง"], 2, "Open Inquiry ให้อิสระแก่ผู้เรียนสูงสุด"],
                        ["ข้อใดเป็นความเข้าใจผิดเกี่ยวกับ Inquiry", ["Inquiry ใช้หลักฐาน", "Inquiry มีหลายระดับ", "Inquiry ต้องให้นักเรียนตั้งคำถามเอง 100% ทุกครั้ง", "Inquiry สร้างคำอธิบายจากข้อมูล"], 2, "ระดับ Inquiry แตกต่างกัน ครูสามารถกำหนดคำถามหรือกรอบได้ตามระดับผู้เรียน"],
                        ["ข้อใดเป็นคำถามที่เหมาะกับ Inquiry มากที่สุด", ["น้ำมีสูตรอะไร?", "ทำไมต้นไม้สองต้นที่ได้รับน้ำเท่ากันจึงโตต่างกัน?", "จงคัดลอกนิยามการสังเคราะห์ด้วยแสง", "ท่องชื่อส่วนประกอบของพืช"], 1, "เป็นคำถามที่นำไปสู่การตั้งสมมติฐาน การเก็บข้อมูล และการทดลองได้"],
                        ["หากครูต้องการให้ผู้เรียนสืบเสาะอย่างมีคุณภาพ ควรเตรียมอะไร", ["สถานการณ์ คำถาม และอุปกรณ์ที่เหมาะสม", "คำตอบทั้งหมด", "ข้อสอบอย่างเดียว", "ใบงานที่ไม่มีคำถาม"], 0, "การจัด Inquiry ต้องมีสถานการณ์ที่เหมาะสม คำถาม และทรัพยากรที่ช่วยให้ผู้เรียนสืบค้น"],
                        ["ข้อใดเป็นองค์ประกอบสำคัญของแผนการจัดการเรียนรู้", ["สาระสำคัญ", "กิจกรรม", "การวัดและประเมินผล", "ถูกทุกข้อ"], 3, "ทั้งหมดเป็นส่วนประกอบที่ช่วยให้แผนมีความครบถ้วนและเชื่อมโยงกัน"],
                        ["หากครูต้องการตรวจสอบความเข้าใจ “ระหว่างที่นักเรียนกำลังทดลอง” ควรใช้", ["Formative Assessment", "Summative Assessment เท่านั้น", "การสอบปลายภาค", "ไม่มีการประเมิน"], 0, "เป็นการประเมินระหว่างเรียนเพื่อใช้ข้อมูลพัฒนาการเรียนรู้"],
                        ["ข้อใดเป็นเหตุผลที่เหมาะสมที่สุดในการเลือก Virtual Lab", ["เพราะดูทันสมัย", "เพราะมีราคาแพง", "เพราะช่วยจำลองการทดลองที่ทำจริงได้ยากหรือไม่ปลอดภัย", "เพราะทำให้ไม่ต้องมีครู"], 2, "จุดเด่นของ Virtual Lab คือช่วยแก้ข้อจำกัดของการทดลองจริง"],
                        ["ข้อใดเป็นรหัสวิชาวิทยาศาสตร์ที่พบในตัวอย่างเอกสารทางการสำหรับ ป.1", ["ว11101", "ว15101", "ว16101", "ว21101"], 0, "ว11101 เป็นตัวอย่างรหัสวิทยาศาสตร์ระดับ ป.1 ในเอกสารทางการ"],
                        ["ข้อใดเป็นข้อความที่ถูกต้องที่สุดเกี่ยวกับเวลาเรียนวิทยาศาสตร์", ["ทุกโรงเรียนต้องเรียน 80 ชั่วโมงต่อปี", "ทุกโรงเรียนต้องเรียน 2 ชั่วโมงต่อสัปดาห์", "ระดับประถมจัดเวลาเรียนเป็นรายปี และรายละเอียดจริงต้องดูหลักสูตรสถานศึกษา", "วิทยาศาสตร์ไม่มีการกำหนดเวลาเลย"], 2, "รายละเอียดการจัดเวลาเรียนต้องพิจารณาหลักสูตรสถานศึกษา"]
                    ]}
                }
            }
        };

        let currentSubjectKey = null;
        let currentExamId = null;

        function show(id) {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden-section'));
            document.getElementById(id).classList.remove('hidden-section');
            window.scrollTo(0, 0);
        }

        function init() {
            const list = document.getElementById('subject-list');
            for (let key in subjectsData) {
                const sub = subjectsData[key];
                list.innerHTML += `
                    <div onclick="selectSubject('${key}')" class="border border-${sub.color}-100 rounded-xl p-5 hover:shadow-lg bg-${sub.color}-50/30 flex flex-col justify-center items-center text-center transition cursor-pointer hover:border-${sub.color}-300 group">
                        <div class="w-16 h-16 rounded-full bg-${sub.color}-100 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300">
                            <i class="${sub.icon} text-3xl text-${sub.color}-600"></i>
                        </div>
                        <h3 class="font-bold text-lg text-${sub.color}-900">${sub.code}</h3>
                        <p class="text-sm text-gray-600 mt-1">${sub.title}</p>
                    </div>`;
            }
            renderHistory();
        }

        function selectSubject(subjectKey) {
            currentSubjectKey = subjectKey;
            const sub = subjectsData[subjectKey];
            document.getElementById('subject-title-display').innerText = `${sub.code} : ${sub.title}`;
            
            const list = document.getElementById('exam-list');
            list.innerHTML = '';
            
            for (let setId in sub.sets) {
                const ex = sub.sets[setId];
                const count = ex.data.length;
                list.innerHTML += `
                    <div class="border border-${sub.color}-100 rounded-xl p-5 hover:shadow-lg bg-${sub.color}-50/10 flex flex-col justify-between transition">
                        <div>
                            <span class="inline-block bg-${sub.color}-100 text-${sub.color}-800 text-xs px-2.5 py-1 rounded-full font-bold mb-3 border border-${sub.color}-200">ปรนัย ${count} ข้อ</span>
                            <h3 class="font-bold text-lg mb-2 text-${sub.color}-900">${ex.title}</h3>
                        </div>
                        <button onclick="startExam('${setId}')" ${count === 0 ? 'disabled' : ''} class="w-full ${count === 0 ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : `bg-${sub.color}-600 hover:bg-${sub.color}-700 text-white`} py-2.5 rounded-lg font-semibold transition shadow-sm mt-4">
                            ${count === 0 ? 'ยังไม่เปิดให้สอบ' : 'เริ่มทำข้อสอบ'}
                        </button>
                    </div>`;
            }
            show('home-sets');
        }

        function startExam(setId) {
            currentExamId = setId;
            const sub = subjectsData[currentSubjectKey];
            const examData = sub.sets[setId];
            
            document.getElementById('exam-title').innerText = examData.title;
            const container = document.getElementById('mcq-questions');
            let html = '';
            
            examData.data.forEach((q, i) => {
                html += `
                <div class="border border-gray-200 rounded-xl p-5 bg-gray-50 shadow-sm hover:bg-white transition">
                    <p class="font-bold text-gray-800 text-base mb-4 leading-relaxed">
                        <span class="inline-block bg-${sub.color}-600 text-white rounded-md px-2 py-0.5 text-sm mr-1.5 font-mono shadow-sm">${i + 1}</span> ${q[0]}
                    </p>
                    <div class="space-y-2.5 pl-2">
                        ${q[1].map((opt, j) => `
                        <label class="flex items-center p-3 rounded-lg border border-transparent hover:border-${sub.color}-200 hover:bg-${sub.color}-50/50 cursor-pointer transition">
                            <input type="radio" name="q${i}" value="${j}" required class="w-4 h-4 text-${sub.color}-600 focus:ring-${sub.color}-500 mr-3">
                            <span class="text-sm font-medium text-gray-700 leading-normal"><strong class="font-bold text-${sub.color}-900 mr-2">${sub.labels[j]}.</strong> ${opt}</span>
                        </label>`).join('')}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            document.getElementById('exam-form').reset();
            show('exam-area');
        }

        function submitExam(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const sub = subjectsData[currentSubjectKey];
            const examData = sub.sets[currentExamId];
            let score = 0;
            let userAnswers = [];

            examData.data.forEach((q, i) => {
                const userAns = parseInt(fd.get(`q${i}`));
                userAnswers.push(userAns);
                if (userAns === q[2]) score++;
            });

            const historyId = Date.now();
            saveHistory(currentSubjectKey, currentExamId, `${sub.code} - ${examData.title}`, score, examData.data.length, userAnswers, historyId);
            viewHistoryDetail(historyId);
        }

        function saveHistory(subjectKey, examKey, title, score, total, userAnswers, historyId) {
            let history = JSON.parse(localStorage.getItem('smartExamHistoryMaster')) || [];
            history.unshift({ id: historyId, subjectKey, examKey, title, score, total, userAnswers, date: new Date().toLocaleString('th-TH') });
            localStorage.setItem('smartExamHistoryMaster', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('smartExamHistoryMaster')) || [];
            if (history.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400">ยังไม่มีประวัติการสอบ</div>`;
                return;
            }
            container.innerHTML = history.map(item => {
                const subColor = subjectsData[item.subjectKey] ? subjectsData[item.subjectKey].color : 'indigo';
                return `
                <div onclick="viewHistoryDetail(${item.id})" class="border border-gray-200 rounded-xl p-4 flex justify-between items-center bg-white shadow-sm hover:shadow-md hover:border-${subColor}-300 transition cursor-pointer">
                    <div>
                        <h4 class="font-bold text-${subColor}-900">${item.title}</h4>
                        <p class="text-xs text-gray-500 mt-1"><i class="far fa-clock mr-1"></i> ${item.date}</p>
                    </div>
                    <div class="text-right flex items-center">
                        <div class="mr-4">
                            <span class="text-2xl font-black text-${subColor}-600">${item.score}</span>
                            <span class="text-sm text-gray-400">/ ${item.total}</span>
                        </div>
                        <i class="fas fa-chevron-right text-${subColor}-300 text-lg"></i>
                    </div>
                </div>`;
            }).join('');
        }

        function viewHistoryDetail(historyId) {
            let history = JSON.parse(localStorage.getItem('smartExamHistoryMaster')) || [];
            let item = history.find(h => h.id === historyId);
            if (!item) return;

            const sub = subjectsData[item.subjectKey];
            const examData = sub.sets[item.examKey];
            let resultHtml = '';

            examData.data.forEach((q, i) => {
                const userAns = item.userAnswers[i];
                const isCorrect = userAns === q[2];

                resultHtml += `
                <div class="border rounded-xl p-5 mb-4 shadow-sm ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
                    <div class="flex items-start justify-between">
                        <p class="font-bold text-gray-900 mb-3 leading-relaxed">ข้อที่ ${i + 1}: ${q[0]}</p>
                        <span class="text-xs px-2.5 py-1 rounded font-bold shadow-sm ${isCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}">
                            ${isCorrect ? 'ถูกต้อง' : 'ไม่ถูกต้อง'}
                        </span>
                    </div>
                    <div class="text-sm space-y-2 mb-4">
                        <p class="text-gray-700">คำตอบของคุณ: <span class="font-semibold ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">${sub.labels[userAns]}. ${q[1][userAns]}</span></p>
                        ${!isCorrect ? `<p class="text-gray-700">คำตอบที่ถูกต้อง: <span class="text-emerald-700 font-bold">${sub.labels[q[2]]}. ${q[1][q[2]]}</span></p>` : ''}
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-gray-200 text-sm text-gray-600 shadow-sm leading-relaxed">
                        <strong class="text-${sub.color}-900"><i class="fas fa-lightbulb text-yellow-500 mr-1.5"></i>คำอธิบาย:</strong> ${q[3]}
                    </div>
                </div>`;
            });

            document.getElementById('result-meta-info').innerText = `${item.title} | ทำเมื่อ: ${item.date}`;
            document.getElementById('final-score').innerText = `${item.score} / ${item.total}`;
            document.getElementById('final-score').className = `text-5xl font-black text-${sub.color}-600 my-4`;
            const percentage = Math.round((item.score / item.total) * 100);
            document.getElementById('percentage-score').innerText = `คิดเป็น ${percentage}% (${item.score >= item.total/2 ? 'ผ่านเกณฑ์' : 'ควรทบทวน'})`;
            document.getElementById('result-details').innerHTML = resultHtml;
            
            show('result-area');
        }

        function clearHistory() {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างประวัติการสอบทั้งหมด?')) {
                localStorage.removeItem('smartExamHistoryMaster');
                renderHistory();
            }
        }
    </script>
</body>
</html>
