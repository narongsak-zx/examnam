<!DOCTYPE html>
<html lang="th">
<head>

<body class="text-gray-800" onload="init()">

    <!-- Main Container -->

        <!-- Section: Home -->

            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="exam-list"></div>
        </div>

        <!-- Section: Exam Form -->
        <div id="exam-area" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <div>
                    <h2 id="exam-title" class="text-2xl font-bold text-teal-800"></h2>

                        <i class="fas fa-check-circle mr-2"></i> ส่งตรวจข้อสอบ
                    </button>
                </div>

        </div>

            <div class="text-center border-b pb-6 mb-6">

            </div>

    </main>

                    ["ขั้นแรกของ Bloom’s Taxonomy คือข้อใด", ["Analyze", "Evaluate", "Remember", "Create"], 2, "ลำดับคือ Remember → Understand → Apply → Analyze → Evaluate → Create"],

                    ["หากนักเรียนใช้ข้อมูลส่วนตัวของเพื่อนในงานโดยไม่ได้รับอนุญาต ประเด็นใดควรคำนึงถึงมากที่สุด", ["Privacy", "Accuracy", "Accessibility", "Binary"], 0, "Privacy เกี่ยวข้องกับการคุ้มครองข้อมูลและความเป็นส่วนตัวของบุคคล"],
                    ["ข้อใดสอดคล้องกับ “Accuracy” ใน PAPA", ["ตรวจสอบว่าข้อมูลถูกต้องหรือไม่", "ปกป้องข้อมูลส่วนตัว", "คำนึงถึงสิทธิในทรัพย์สิน", "กำหนดว่าใครเข้าถึงข้อมูลได้"], 0, "Accuracy หมายถึงความถูกต้องของข้อมูล"],
                    ["การปฏิบัติตนอย่างสุภาพและเหมาะสมเมื่อสื่อสารบนอินเทอร์เน็ตเรียกว่าอะไร", ["Netiquette", "Binary", "Hardware", "Modem"], 0, "Netiquette คือมารยาทในการใช้งานและสื่อสารบนเครือข่ายหรือโลกออนไลน์"],
                    ["เมื่อนำ ChatGPT, Gemini, Canva AI หรือ Claude AI มาใช้ในการเรียน สิ่งใดควรทำเป็นหลัก", ["ตรวจสอบข้อมูล คำนึงถึงจริยธรรม ลิขสิทธิ์ และความเป็นส่วนตัว", "เชื่อคำตอบทุกอย่างโดยไม่ตรวจสอบ", "นำคำตอบไปส่งโดยไม่แก้ไข", "เปิดเผยข้อมูลส่วนตัวให้ AI ทุกครั้ง"], 0, "การใช้ AI อย่างรับผิดชอบ โดยต้องคำนึงถึง Accuracy, Ethics, Copyright และ Privacy"]
                ]
            }
        };

        let currentExamId = null;
        const optionsLabels = ['ก', 'ข', 'ค', 'ง'];

        function show(id) {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden-section'));
            document.getElementById(id).classList.remove('hidden-section');
            window.scrollTo(0, 0);
        }

        function init() {
            const list = document.getElementById('exam-list');
            for (let id in rawExams) {
                const ex = rawExams[id];
                list.innerHTML += `
                    <div class="border border-teal-100 rounded-xl p-5 hover:shadow-lg bg-teal-50/30 flex flex-col justify-between transition">
                        <div>
                            <span class="inline-block bg-teal-100 text-teal-800 text-xs px-2.5 py-1 rounded-full font-bold mb-3 border border-teal-200">ปรนัย ${ex.data.length} ข้อ</span>
                            <h3 class="font-bold text-lg mb-2 text-teal-900">${ex.title}</h3>
                        </div>
                        <button onclick="startExam('${id}')" class="w-full bg-teal-600 text-white py-2.5 rounded-lg hover:bg-teal-700 font-semibold transition shadow-sm mt-4">เริ่มทำข้อสอบ</button>
                    </div>`;
            }
            renderHistory();
        }

        function startExam(id) {
            currentExamId = id;
            document.getElementById('exam-title').innerText = rawExams[id].title;
            const container = document.getElementById('mcq-questions');
            let html = '';
            
            rawExams[id].data.forEach((q, i) => {
                html += `
                <div class="border border-gray-200 rounded-xl p-5 bg-gray-50 shadow-sm hover:bg-white transition">
                    <p class="font-bold text-gray-800 text-base mb-4 leading-relaxed">
                        <span class="inline-block bg-teal-600 text-white rounded-md px-2 py-0.5 text-sm mr-1.5 font-mono shadow-sm">${i + 1}</span> ${q[0]}
                    </p>
                    <div class="space-y-2.5 pl-2">
                        ${q[1].map((opt, j) => `
                        <label class="flex items-center p-3 rounded-lg border border-transparent hover:border-teal-200 hover:bg-teal-50/50 cursor-pointer transition">
                            <input type="radio" name="q${i}" value="${j}" required class="w-4 h-4 text-teal-600 focus:ring-teal-500 mr-3">
                            <span class="text-sm font-medium text-gray-700 leading-normal"><strong class="font-bold text-teal-900 mr-2">${optionsLabels[j]}.</strong>${opt}</span>
                        </label>`).join('')}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            document.getElementById('exam-form').reset();
            show('exam-area');
        }

        function submitExam(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = rawExams[currentExamId].data;
            let score = 0;
            let userAnswers = [];

            data.forEach((q, i) => {
                const userAns = parseInt(fd.get(`q${i}`));
                userAnswers.push(userAns);
                if (userAns === q[2]) score++;
            });

            const historyId = Date.now();
            saveHistory(currentExamId, rawExams[currentExamId].title, score, data.length, userAnswers, historyId);
            viewHistoryDetail(historyId);
        }

        function saveHistory(examId, title, score, total, userAnswers, historyId) {
            let history = JSON.parse(localStorage.getItem('ed1200205HistoryV2')) || [];
            history.unshift({ id: historyId, examId, title, score, total, userAnswers, date: new Date().toLocaleString('th-TH') });
            localStorage.setItem('ed1200205HistoryV2', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('ed1200205HistoryV2')) || [];
            if (history.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400">ยังไม่มีประวัติการสอบ</div>`;
                return;
            }
            container.innerHTML = history.map(item => `
                <div onclick="viewHistoryDetail(${item.id})" class="border border-gray-200 rounded-xl p-4 flex justify-between items-center bg-white shadow-sm hover:shadow-md hover:border-teal-300 transition cursor-pointer">
                    <div>
                        <h4 class="font-bold text-teal-900">${item.title}</h4>
                        <p class="text-xs text-gray-500 mt-1"><i class="far fa-clock mr-1"></i> ${item.date}</p>
                    </div>
                    <div class="text-right flex items-center">
                        <div class="mr-4">
                            <span class="text-2xl font-black text-teal-600">${item.score}</span>
                            <span class="text-sm text-gray-400">/ ${item.total}</span>
                        </div>
                        <i class="fas fa-chevron-right text-teal-300 text-lg"></i>
                    </div>
                </div>`).join('');
        }

        function viewHistoryDetail(historyId) {
            let history = JSON.parse(localStorage.getItem('ed1200205HistoryV2')) || [];
            let item = history.find(h => h.id === historyId);
            if (!item) return;

            const data = rawExams[item.examId].data;
            let resultHtml = '';

            data.forEach((q, i) => {
                const userAns = item.userAnswers[i];
                const isCorrect = userAns === q[2];

                resultHtml += `
                <div class="border rounded-xl p-5 mb-4 shadow-sm ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
                    <div class="flex items-start justify-between">
                        <p class="font-bold text-gray-900 mb-3 leading-relaxed">ข้อที่ ${i + 1}: ${q[0]}</p>
                        <span class="text-xs px-2.5 py-1 rounded font-bold shadow-sm ${isCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}">
                            ${isCorrect ? 'ถูกต้อง' : 'ไม่ถูกต้อง'}
                        </span>
                    </div>
                    <div class="text-sm space-y-2 mb-4">
                        <p class="text-gray-700">คำตอบของคุณ: <span class="font-semibold ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">${optionsLabels[userAns]}. ${q[1][userAns]}</span></p>
                        ${!isCorrect ? `<p class="text-gray-700">คำตอบที่ถูกต้อง: <span class="text-emerald-700 font-bold">${optionsLabels[q[2]]}.${q[1][q[2]]}</span></p>` : ''}
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-gray-200 text-sm text-gray-600 shadow-sm leading-relaxed">
                        <strong class="text-teal-900"><i class="fas fa-lightbulb text-yellow-500 mr-1.5"></i>คำอธิบาย:</strong> ${q[3]}
                    </div>
                </div>`;
            });

            document.getElementById('result-meta-info').innerText = `${item.title} | ทำเมื่อ: ${item.date}`;
            document.getElementById('final-score').innerText = `${item.score} / ${item.total}`;
            const percentage = Math.round((item.score / item.total) * 100);
            document.getElementById('percentage-score').innerText = `คิดเป็น ${percentage}% (${item.score >= item.total/2 ? 'ผ่านเกณฑ์' : 'ควรทบทวน'})`;
            document.getElementById('result-details').innerHTML = resultHtml;
            
            show('result-area');
        }

        function clearHistory() {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างประวัติการสอบทั้งหมด?')) {
                localStorage.removeItem('ed1200205HistoryV2');
                renderHistory();
            }
        }
    </script>
</body>
</html>
