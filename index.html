<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทดสอบจำลองดาราศาสตร์ 240 ข้อ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .hidden-section { display: none; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="text-gray-800" onload="init()">

    <!-- Navbar -->
    <nav class="bg-indigo-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold cursor-pointer" onclick="show('home')">
                <i class="fas fa-meteor mr-2 text-yellow-300"></i> AstroMaster Exam
            </h1>
            <button onclick="show('history')" class="hover:bg-indigo-700 px-3 py-2 rounded text-sm transition">
                <i class="fas fa-history mr-1"></i> ประวัติการสอบ
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 mt-4">
        
        <!-- Section: Home -->
        <div id="home" class="bg-white rounded-xl shadow-md p-6">
            <div class="border-b pb-4 mb-6">
                <h2 class="text-2xl font-bold text-indigo-900">เลือกชุดข้อสอบดาราศาสตร์</h2>
                <p class="text-gray-600 mt-1">ข้อสอบปรนัยชุดละ 80 ข้อ ครอบคลุมเนื้อหาดาราศาสตร์และอวกาศ</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="exam-list"></div>
        </div>

        <!-- Section: Exam Form -->
        <div id="exam-area" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <div>
                    <h2 id="exam-title" class="text-2xl font-bold text-indigo-800"></h2>
                    <p class="text-sm text-gray-500 mt-1">เลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว</p>
                </div>
                <button onclick="if(confirm('ต้องการยกเลิกการทำข้อสอบชุดนี้หรือไม่?')) show('home')" class="text-gray-400 hover:text-red-500 text-sm">
                    <i class="fas fa-times-circle text-lg"></i> ยกเลิก
                </button>
            </div>
            <form id="exam-form" onsubmit="submitExam(event)">
                <div id="mcq-questions" class="space-y-6"></div>
                <div class="text-center mt-10 pb-6 border-t pt-6">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-10 rounded-xl shadow-lg transition transform hover:scale-105">
                        <i class="fas fa-check-circle mr-2"></i> ส่งตรวจข้อสอบ
                    </button>
                </div>
            </form>
        </div>

        <!-- Section: Result -->
        <div id="result-area" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="text-center border-b pb-6 mb-6">
                <h2 class="text-3xl font-extrabold text-indigo-900 mb-2">ผลการประเมิน</h2>
                <div class="text-5xl font-black text-indigo-600 my-4" id="final-score"></div>
                <p class="text-lg font-semibold text-gray-700" id="percentage-score"></p>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-list-ol mr-2 text-indigo-600"></i> เฉลยและคำอธิบายรายข้อ</h3>
            <div id="result-details" class="space-y-4"></div>
            <div class="text-center mt-8 pt-4 border-t">
                <button onclick="show('home')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-8 rounded-lg transition">กลับสู่หน้าแรก</button>
            </div>
        </div>

        <!-- Section: History -->
        <div id="history" class="hidden-section bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-3">
                <h2 class="text-2xl font-bold text-indigo-900">ประวัติการทำข้อสอบ</h2>
                <button onclick="clearHistory()" class="text-red-600 border border-red-200 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-50">ล้างประวัติ</button>
            </div>
            <div id="history-list" class="space-y-3"></div>
        </div>

    </main>

    <script>
        // ==========================================
        // Data Compression: [ "คำถาม", ["ก","ข","ค","ง"], ดัชนีข้อถูก(0-3), "คำอธิบาย" ]
        // เพื่อรีดประสิทธิภาพให้ไฟล์โหลดไวที่สุด ไม่ค้างแม้มี 240 ข้อ
        // ==========================================
        const rawExams = {
            "set-1": {
                title: "ข้อสอบดาราศาสตร์ ชุดที่ 1",
                data: [
                    ["ข้อใดอธิบายความหมายของ “ดาวฤกษ์” ได้ถูกต้องที่สุด", ["วัตถุที่สะท้อนแสงจากดวงอาทิตย์", "วัตถุท้องฟ้าที่ปล่อยพลังงานออกมาได้จากภายใน", "วัตถุขนาดเล็กที่โคจรรอบดาวเคราะห์", "ก้อนหินที่ลอยอยู่ในอวกาศ"], 1, "ดาวฤกษ์เป็นวัตถุท้องฟ้าที่มีพลังงานภายในของตัวเอง โดยพลังงานสำคัญเกิดจากกระบวนการหลอมรวมนิวเคลียสภายในดาว"],
                    ["แหล่งพลังงานหลักของดาวฤกษ์ในช่วงที่อยู่บน Main Sequence คืออะไร", ["การเผาไหม้", "การสะท้อนแสง", "การหลอมรวมนิวเคลียส", "การชนกับดาวเคราะห์"], 2, "ดาวฤกษ์ใน Main Sequence ได้พลังงานหลักจาก Nuclear Fusion (นิวเคลียร์ฟิวชัน) โดยนิวเคลียสของไฮโดรเจนหลอมรวมกัน"],
                    ["ข้อใดเป็นตัวอย่างของคลื่นแม่เหล็กไฟฟ้า", ["คลื่นน้ำ", "คลื่นเสียง", "แสง", "คลื่นที่เกิดจากเชือก"], 2, "แสงเป็นคลื่นแม่เหล็กไฟฟ้า และนักดาราศาสตร์สามารถศึกษาดาวฤกษ์จากคลื่นแม่เหล็กไฟฟ้าที่เดินทางมาถึงโลกได้"],
                    ["ความสัมพันธ์ระหว่างความเร็วแสง c ความยาวคลื่น λ และความถี่ f คือข้อใด", ["c=λf", "c=λ/f", "c=f/λ", "c=λ+f"], 0, "สมการพื้นฐานของคลื่นคือ c=λf เมื่อความยาวคลื่นเพิ่มขึ้น ความถี่จะลดลง หากความเร็วแสงคงที่"],
                    ["ถ้าความยาวคลื่นของแสงเพิ่มขึ้น ความถี่จะเป็นอย่างไร", ["เพิ่มขึ้น", "ลดลง", "คงที่เสมอ", "เป็นศูนย์"], 1, "จาก c=λf เมื่อ c คงที่ ความยาวคลื่นกับความถี่จะแปรผกผันกัน ดังนั้นความยาวคลื่นมาก → ความถี่น้อย"],
                    ["พลังงานของโฟตอนสัมพันธ์กับความถี่อย่างไร", ["E ∝ f", "E ∝ 1/f", "E ∝ f²", "ไม่สัมพันธ์กัน"], 0, "พลังงานโฟตอนเป็น E=hf ดังนั้นความถี่สูงจะมีพลังงานสูง"],
                    ["ถ้าแสงมีความยาวคลื่นสั้นลง พลังงานของโฟตอนจะเป็นอย่างไร", ["ลดลง", "เพิ่มขึ้น", "ไม่เปลี่ยน", "เป็นศูนย์"], 1, "ความยาวคลื่นสั้น → ความถี่สูง → พลังงานสูง เพราะ E=hf"],
                    ["สีของดาวฤกษ์สามารถใช้บอกข้อมูลใดได้เป็นหลัก", ["อายุที่แน่นอน", "อุณหภูมิพื้นผิว", "มวลที่แน่นอน", "ระยะทางที่แน่นอน"], 1, "สีของดาวสัมพันธ์กับอุณหภูมิพื้นผิว ดาวที่มีสีออกน้ำเงินมีอุณหภูมิสูงกว่าดาวที่มีสีออกแดง"],
                    ["ดาวฤกษ์สีน้ำเงินโดยทั่วไปมีอุณหภูมิพื้นผิวอย่างไรเมื่อเทียบกับดาวสีแดง", ["ต่ำกว่า", "สูงกว่า", "เท่ากัน", "บอกไม่ได้เลย"], 1, "ดาวสีน้ำเงินมีการแผ่รังสีที่มีความยาวคลื่นสั้นกว่า จึงสัมพันธ์กับอุณหภูมิพื้นผิวที่สูงกว่า"],
                    ["กฎของ Wien ใช้ศึกษาความสัมพันธ์ระหว่างอะไร", ["มวลกับระยะทาง", "ความยาวคลื่นสูงสุดกับอุณหภูมิ", "ความสว่างกับเวลา", "คาบโคจรกับมวล"], 1, "กฎการเลื่อนของ Wien คือ λ_max T = b จึงใช้เชื่อมโยง ความยาวคลื่นที่มีความเข้มสูงสุด กับอุณหภูมิพื้นผิวของวัตถุ"],
                    ["ถ้าดาวดวงหนึ่งมี λ_max สั้นกว่าอีกดวง ดาวดวงแรกมีแนวโน้มเป็นอย่างไร", ["เย็นกว่า", "ร้อนกว่า", "มีมวลน้อยกว่าเสมอ", "อยู่ใกล้โลกกว่าเสมอ"], 1, "จาก λ_max T = b เมื่อความยาวคลื่นสูงสุดสั้นลง อุณหภูมิจะสูงขึ้น"],
                    ["ลำดับชนิดสเปกตรัมของดาวฤกษ์จากร้อนไปเย็นคือข้อใด", ["ABCDEFG", "OBAFGKM", "MKGFABO", "OCEAN"], 1, "จำลำดับ O → B → A → F → G → K → M จากร้อนที่สุดไปเย็นที่สุด"],
                    ["ดาวชนิด O มีอุณหภูมิเมื่อเทียบกับดาวชนิด M อย่างไร", ["O เย็นกว่า M", "O ร้อนกว่า M", "เท่ากัน", "ไม่มีความสัมพันธ์"], 1, "O อยู่ต้นลำดับ OBAFGKM จึงเป็นกลุ่มดาวที่ร้อนมาก ส่วน M อยู่ท้ายลำดับและเย็นกว่า"],
                    ["Sirius A มีสเปกตรัม A1 ส่วน Aldebaran A มีสเปกตรัม K5 ดาวใดมีอุณหภูมิพื้นผิวสูงกว่า", ["Aldebaran A", "Sirius A", "เท่ากัน", "บอกไม่ได้จากสเปกตรัม"], 1, "ในลำดับ OBAFGKM ชนิด A อยู่ก่อนชนิด K ดังนั้น A ร้อนกว่า K"],
                    ["ข้อใดเรียงลำดับอุณหภูมิจากสูงไปต่ำได้ถูกต้อง", ["M K G F A O", "O A F G K M", "O F A M G K", "K M O A F G"], 1, "ลำดับมาตรฐานคือ OBAFGKM จากร้อนไปเย็น"],
                    ["การศึกษาสเปกตรัมของดาวช่วยให้นักดาราศาสตร์ทราบข้อมูลใดได้", ["คุณสมบัติของดาว เช่น อุณหภูมิและองค์ประกอบบางอย่าง", "จำนวนดาวเคราะห์ทั้งหมดของดาวนั้นแน่นอน", "อายุที่แน่นอนเพียงอย่างเดียว", "ระยะทางโดยไม่ต้องใช้ข้อมูลอื่น"], 0, "สเปกตรัมมีข้อมูลเกี่ยวกับแสงของดาวและเส้นสเปกตรัม ซึ่งใช้ศึกษาคุณสมบัติทางกายภาพและองค์ประกอบของดาวได้"],
                    ["คำว่า Luminosity หมายถึงอะไร", ["ความสว่างที่ตาเรามองเห็นเท่านั้น", "พลังงานทั้งหมดที่ดาวปล่อยออกมาต่อหน่วยเวลา", "ระยะห่างจากโลก", "สีของดาว"], 1, "Luminosity คือกำลังการแผ่พลังงานของดาว หรือพลังงานที่ดาวปล่อยออกมาต่อหน่วยเวลา เป็นคุณสมบัติของตัวดาวเอง"],
                    ["Brightness หรือ Apparent Brightness หมายถึงอะไร", ["พลังงานทั้งหมดที่ดาวผลิต", "ความสว่างของดาวที่ผู้สังเกตได้รับ", "อุณหภูมิพื้นผิว", "ขนาดของดาว"], 1, "Brightness คือความสว่างที่เราสังเกตเห็นจากตำแหน่งของเรา จึงขึ้นกับทั้งความสว่างของดาวและระยะทาง"],
                    ["ดาวสองดวงมี Luminosity เท่ากัน แต่ดาว A อยู่ใกล้โลกกว่าดาว B เราจะเห็นดาวใดสว่างกว่า", ["A", "B", "เท่ากัน", "ขึ้นอยู่กับชื่อดาว"], 0, "ตามกฎกำลังสองผกผัน b ∝ 1/d² ดาวที่อยู่ใกล้กว่าจะมี Brightness ที่เรารับได้มากกว่า"],
                    ["ถ้าระยะห่างจากดาวเพิ่มขึ้นเป็น 2 เท่า Brightness จะเป็นอย่างไร", ["เพิ่ม 2 เท่า", "ลด 2 เท่า", "ลด 4 เท่า", "เพิ่ม 4 เท่า"], 2, "เพราะ b ∝ 1/d² เมื่อระยะเพิ่ม 2 เท่า Brightness จะลดลง 2² = 4 เท่า"],
                    ["ข้อใดถูกต้องเกี่ยวกับ Luminosity และ Brightness", ["เป็นสิ่งเดียวกัน", "Luminosity เป็นคุณสมบัติของดาว ส่วน Brightness ขึ้นกับตำแหน่งผู้สังเกต", "Brightness ไม่ขึ้นกับระยะทาง", "Luminosity เปลี่ยนทุกครั้งที่ผู้สังเกตเคลื่อนที่"], 1, "Luminosity เป็นกำลังการแผ่พลังงานของดาว ส่วน Brightness เป็นพลังงานที่ผู้สังเกตได้รับต่อพื้นที่ จึงขึ้นกับระยะทาง"],
                    ["สมการใดแสดงความสัมพันธ์ระหว่าง Luminosity, Brightness และระยะทาง", ["b = 4πd²L", "b = L / (4πd²)", "b = Ld²", "b = L + d"], 1, "สมการคือ b = L / (4πd²) จึงเห็นได้ว่าเมื่อระยะทางเพิ่ม Brightness ลดลงตามกำลังสองของระยะทาง"],
                    ["ดาวที่มี Luminosity มากไม่ได้หมายความว่าจะต้องมองเห็นสว่างกว่าเสมอ เพราะเหตุใด", ["Luminosity ไม่มีจริง", "อาจอยู่ไกลกว่า", "อุณหภูมิไม่มีผล", "ดาวที่สว่างจะมืดลงเสมอ"], 1, "ดาวที่มี Luminosity สูงอาจอยู่ไกลมากจน Brightness ที่มาถึงโลกน้อยกว่าดาวที่มี Luminosity ต่ำกว่าแต่ใกล้กว่า"],
                    ["Apparent Magnitude ใช้บอกอะไร", ["ความสว่างที่ปรากฏจากโลก", "มวลของดาว", "อุณหภูมิของแกนกลาง", "อายุของดาว"], 0, "Apparent Magnitude หรือ โชติมาตรปรากฏ ใช้บอกความสว่างที่เรามองเห็นจากโลก"],
                    ["ในระบบ Magnitude ดาวที่มีค่า m น้อยกว่าจะมีลักษณะอย่างไร", ["สว่างกว่า", "มืดกว่า", "เย็นกว่าเสมอ", "อยู่ไกลกว่าเสมอ"], 0, "ระบบ Magnitude เป็นระบบที่กลับด้าน คือ ค่า Magnitude ยิ่งน้อย → ดาวยิ่งสว่าง"],
                    ["ดาว A มี m = -1 และดาว B มี m = 3 ดาวใดปรากฏสว่างกว่า", ["A", "B", "เท่ากัน", "ตัดสินไม่ได้"], 0, "-1 < 3 ดังนั้นดาว A มีค่า Magnitude น้อยกว่าและปรากฏสว่างกว่า"],

        let currentExamId = null;
        const optionsLabels = ['A', 'B', 'C', 'D'];

        function show(id) {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden-section'));
            document.getElementById(id).classList.remove('hidden-section');
            window.scrollTo(0, 0);
        }

        function init() {
            const list = document.getElementById('exam-list');
            for (let id in rawExams) {
                const ex = rawExams[id];
                list.innerHTML += `
                    <div class="border rounded-xl p-5 hover:shadow-lg bg-gray-50 flex flex-col justify-between transition border-gray-200">
                        <div>
                            <span class="inline-block bg-indigo-100 text-indigo-800 text-xs px-2.5 py-1 rounded-full font-bold mb-3 border border-indigo-200">ปรนัย ${ex.data.length} ข้อ</span>
                            <h3 class="font-bold text-lg mb-2 text-indigo-900">${ex.title}</h3>
                        </div>
                        <button onclick="startExam('${id}')" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 font-semibold transition shadow-sm mt-4">เริ่มทำข้อสอบ</button>
                    </div>`;
            }
            renderHistory();
        }

        function startExam(id) {
            currentExamId = id;
            document.getElementById('exam-title').innerText = rawExams[id].title;
            const container = document.getElementById('mcq-questions');
            let html = '';
            
            // ใช้ string concatenation เพื่อลด memory overhead เมื่อเรนเดอร์หลายข้อ
            rawExams[id].data.forEach((q, i) => {
                html += `
                <div class="border border-gray-200 rounded-xl p-5 bg-gray-50 shadow-sm hover:bg-white transition">
                    <p class="font-bold text-gray-800 text-base mb-4 leading-relaxed">
                        <span class="inline-block bg-indigo-600 text-white rounded-md px-2 py-0.5 text-sm mr-1.5 font-mono shadow-sm">${i + 1}</span> ${q[0]}
                    </p>
                    <div class="space-y-2.5 pl-2">
                        ${q[1].map((opt, j) => `
                        <label class="flex items-center p-3 rounded-lg border border-transparent hover:border-indigo-200 hover:bg-indigo-50/50 cursor-pointer transition">
                            <input type="radio" name="q${i}" value="${j}" required class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 mr-3">
                            <span class="text-sm font-medium text-gray-700 leading-normal"><strong class="font-mono text-indigo-900 mr-2">${optionsLabels[j]}.</strong>${opt}</span>
                        </label>`).join('')}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            document.getElementById('exam-form').reset();
            show('exam-area');
        }

        function submitExam(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = rawExams[currentExamId].data;
            let score = 0;
            let resultHtml = '';

            data.forEach((q, i) => {
                const userAns = parseInt(fd.get(`q${i}`));
                const isCorrect = userAns === q[2];
                if (isCorrect) score++;

                resultHtml += `
                <div class="border rounded-xl p-5 mb-4 shadow-sm ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
                    <div class="flex items-start justify-between">
                        <p class="font-bold text-gray-900 mb-3 leading-relaxed">ข้อที่ ${i + 1}: ${q[0]}</p>
                        <span class="text-xs px-2.5 py-1 rounded font-bold shadow-sm ${isCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}">
                            ${isCorrect ? 'ถูกต้อง' : 'ไม่ถูกต้อง'}
                        </span>
                    </div>
                    <div class="text-sm space-y-2 mb-4">
                        <p class="text-gray-700">คำตอบของคุณ: <span class="font-semibold ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">${optionsLabels[userAns]}. ${q[1][userAns]}</span></p>
                        ${!isCorrect ? `<p class="text-gray-700">คำตอบที่ถูกต้อง: <span class="text-emerald-700 font-bold">${optionsLabels[q[2]]}.${q[1][q[2]]}</span></p>` : ''}
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-gray-200 text-sm text-gray-600 shadow-sm leading-relaxed">
                        <strong class="text-indigo-900"><i class="fas fa-lightbulb text-yellow-500 mr-1.5"></i>คำอธิบาย:</strong> ${q[3]}
                    </div>
                </div>`;
            });

            document.getElementById('final-score').innerText = `${score} / ${data.length}`;
            const percentage = Math.round((score / data.length) * 100);
            document.getElementById('percentage-score').innerText = `คิดเป็น ${percentage}% (${score >= data.length/2 ? 'ผ่านเกณฑ์' : 'ควรทบทวน'})`;
            document.getElementById('result-details').innerHTML = resultHtml;
            
            saveHistory(rawExams[currentExamId].title, score, data.length);
            show('result-area');
        }

        function saveHistory(title, score, total) {
            let history = JSON.parse(localStorage.getItem('astroMasterHistory')) || [];
            history.unshift({ title, score, total, date: new Date().toLocaleString('th-TH') });
            localStorage.setItem('astroMasterHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('astroMasterHistory')) || [];
            if (history.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400">ยังไม่มีประวัติการสอบ</div>`;
                return;
            }
            container.innerHTML = history.map(item => `
                <div class="border border-gray-200 rounded-xl p-4 flex justify-between items-center bg-white shadow-sm hover:shadow-md transition">
                    <div>
                        <h4 class="font-bold text-indigo-900">${item.title}</h4>
                        <p class="text-xs text-gray-500 mt-1"><i class="far fa-clock mr-1"></i> ${item.date}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl font-black text-indigo-600">${item.score}</span>
                        <span class="text-sm text-gray-400">/ ${item.total}</span>
                    </div>
                </div>`).join('');
        }

        function clearHistory() {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างประวัติการสอบทั้งหมด?')) {
                localStorage.removeItem('astroMasterHistory');
                renderHistory();
            }
        }
    </script>
</body>
</html>
